<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#091A2B" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F6B100" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Bar Chart Gradient 1 -->
    <linearGradient id="hBar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Bar Chart Gradient 2 -->
    <linearGradient id="hBar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Trend Glow Filter -->
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="756" height="166" rx="16" fill="url(#hBgGrad)" stroke="#1E3A5F" stroke-width="2" />
  
  <!-- Left Side: Icon Emblem (Scaled 0.28 centered at x=20, y=10) -->
  <g transform="translate(18, 12)">
    <!-- Emblem Backing -->
    <rect x="0" y="0" width="146" height="146" rx="30" fill="#0A1829" stroke="url(#hGoldGrad)" stroke-width="2.5" />
    
    <!-- Coordinate Axis Baseline -->
    <line x1="24" y1="114" x2="122" y2="114" stroke="#475569" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

    <!-- Bar Chart 1 -->
    <rect x="32" y="88" width="12" height="26" rx="2" fill="url(#hBar1Grad)" />
    <!-- Bar Chart 2 -->
    <rect x="49" y="68" width="12" height="46" rx="2" fill="url(#hBar2Grad)" />
    <!-- Bar Chart 3 (Peak) -->
    <rect x="66" y="46" width="12" height="68" rx="2" fill="url(#hGoldGrad)" />
    <!-- Bar Chart 4 -->
    <rect x="83" y="74" width="12" height="40" rx="2" fill="url(#hBar2Grad)" />
    <!-- Bar Chart 5 -->
    <rect x="100" y="60" width="12" height="54" rx="2" fill="url(#hBar1Grad)" />

    <!-- SNA Network Lines -->
    <g stroke="#38BDF8" stroke-width="1.2" opacity="0.75">
      <line x1="38" y1="84" x2="55" y2="62" />
      <line x1="55" y1="62" x2="72" y2="38" />
      <line x1="72" y1="38" x2="89" y2="68" />
      <line x1="89" y1="68" x2="106" y2="52" />
      <line x1="55" y1="62" x2="89" y2="68" stroke-dasharray="2,2" stroke="#F59E0B" opacity="0.5" />
    </g>

    <!-- Trend Line -->
    <path d="M 28 88 Q 55 60 72 38 T 115 50" fill="none" stroke="url(#hGoldGrad)" stroke-width="2" stroke-linecap="round" filter="url(#hGlow)" />

    <!-- Network Nodes -->
    <circle cx="38" cy="84" r="3.5" fill="#1D4ED8" stroke="#93C5FD" stroke-width="1.2" />
    <circle cx="55" cy="62" r="4.5" fill="#0284C7" stroke="#BAE6FD" stroke-width="1.5" />
    <circle cx="72" cy="38" r="6.5" fill="url(#hGoldGrad)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#hGlow)" />
    <circle cx="89" cy="68" r="4.5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.2" />
    <circle cx="106" cy="52" r="5" fill="#D97706" stroke="#FDE68A" stroke-width="1.5" />
  </g>

  <!-- Right Side: Official Typographic Lockup -->
  <g transform="translate(190, 24)">
    <!-- Top Pill Badge + Supertitle -->
    <g transform="translate(0, 4)">
      <rect x="0" y="0" width="38" height="22" rx="4" fill="url(#hGoldGrad)" />
      <text x="19" y="16" fill="#0F172A" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="0.5">PPI</text>
      
      <text x="48" y="16" fill="#38BDF8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12.5" letter-spacing="1.2">POLICY INTELLIGENCE &amp; ANALYTICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="58" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" letter-spacing="0.4">
      MONITORING KEBIJAKAN PUBLIK
    </text>

    <!-- Subtitle / Technological Spine -->
    <text x="0" y="86" fill="#94A3B8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="13.5" letter-spacing="0.2">
      Sistem Analisis Jaringan Sosial (SNA) Multiplatform &amp; IndoBERT Deep Learning
    </text>

    <!-- Institutional Focus Pills -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="60" height="18" rx="9" fill="#1E293B" />
      <text x="30" y="13" fill="#E2E8F0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9.5" text-anchor="middle">MBG</text>

      <rect x="68" y="0" width="105" height="18" rx="9" fill="#1E293B" />
      <text x="120" y="13" fill="#E2E8F0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9.5" text-anchor="middle">Sekolah Rakyat</text>

      <rect x="181" y="0" width="65" height="18" rx="9" fill="#1E293B" />
      <text x="213" y="13" fill="#E2E8F0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9.5" text-anchor="middle">KDMP</text>

      <text x="260" y="13" fill="#64748B" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="10.5">• 7 Kanal Media Digital Terintegrasi</text>
    </g>
  </g>
</svg>
