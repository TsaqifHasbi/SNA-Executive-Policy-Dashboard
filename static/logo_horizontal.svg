<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#0A1C2E" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F6B100" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <linearGradient id="hNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14385C"/>
      <stop offset="0.55" stop-color="#0F2942"/>
      <stop offset="1" stop-color="#0B1E33"/>
    </linearGradient>
    <linearGradient id="hGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="1" stop-color="#F6B100"/>
    </linearGradient>
    <linearGradient id="hTech" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="hGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hShieldClip">
      <path d="M256 28 L452 88 V250 C452 350 376 430 256 486 C136 430 60 350 60 250 V88 Z"/>
    </clipPath>
    <filter id="hSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="756" height="156" rx="14" fill="url(#hBgGrad)" stroke="#1E3A5F" stroke-width="1.8" />
  
  <!-- Left Side: User Shield Emblem (Scaled 0.28 centered at x=18, y=8) -->
  <g transform="translate(18, 6) scale(0.285)">
    <!-- Shield outer gold frame -->
    <path d="M256 14 L466 78 V252 C466 360 384 446 256 500 C128 446 46 360 46 252 V78 Z" fill="url(#hGoldGrad)" />
    <!-- Shield navy body -->
    <path d="M256 28 L452 88 V250 C452 350 376 430 256 486 C136 430 60 350 60 250 V88 Z" fill="url(#hNavy)"/>
    <path d="M256 28 L452 88 V250 C452 350 376 430 256 486 C136 430 60 350 60 250 V88 Z" fill="url(#hGlow)"/>

    <g clip-path="url(#hShieldClip)">
      <!-- subtle grid -->
      <g stroke="#94A3B8" stroke-opacity="0.12" stroke-width="1.5">
        <path d="M60 150H452M60 200H452M60 250H452M60 300H452M60 350H452M60 400H452"/>
        <path d="M110 28V486M160 28V486M210 28V486M260 28V486M310 28V486M360 28V486M410 28V486"/>
      </g>

      <!-- Inner thin gold line -->
      <path d="M256 44 L438 99 V249 C438 340 369 415 256 467 C143 415 74 340 74 249 V99 Z" fill="none" stroke="#F6B100" stroke-opacity="0.5" stroke-width="2"/>

      <!-- SNA network (upper area) -->
      <g stroke="url(#hTech)" stroke-width="2.5" stroke-opacity="0.9" fill="none">
        <path d="M150 128 L206 100 L268 122 L326 96 L378 130"/>
        <path d="M206 100 L190 160 L150 128"/>
        <path d="M268 122 L250 172 L190 160"/>
        <path d="M268 122 L318 168 L378 130"/>
        <path d="M326 96 L318 168"/>
        <path d="M250 172 L318 168"/>
        <path d="M190 160 L206 100"/>
      </g>
      <g stroke="#94A3B8" stroke-opacity="0.5" stroke-width="1.5" fill="none">
        <path d="M150 128 L190 160"/>
        <path d="M378 130 L400 176"/>
        <path d="M318 168 L400 176"/>
        <path d="M150 128 L122 172"/>
        <path d="M190 160 L122 172"/>
      </g>
      <g filter="url(#hSoft)">
        <circle cx="206" cy="100" r="10" fill="#38BDF8"/>
        <circle cx="268" cy="122" r="13" fill="url(#hGoldGrad)"/>
        <circle cx="326" cy="96" r="9" fill="#38BDF8"/>
        <circle cx="378" cy="130" r="10" fill="#2563EB"/>
        <circle cx="150" cy="128" r="9" fill="#2563EB"/>
        <circle cx="190" cy="160" r="11" fill="#FFFFFF"/>
        <circle cx="250" cy="172" r="8" fill="#38BDF8"/>
        <circle cx="318" cy="168" r="11" fill="#FFFFFF"/>
      </g>
      <circle cx="122" cy="172" r="7" fill="#94A3B8"/>
      <circle cx="400" cy="176" r="7" fill="#94A3B8"/>
      <circle cx="268" cy="122" r="20" fill="none" stroke="#F6B100" stroke-opacity="0.6" stroke-width="2"/>

      <!-- Baseline -->
      <rect x="112" y="404" width="288" height="4" rx="2" fill="#94A3B8" fill-opacity="0.7"/>

      <!-- Ascending bar chart -->
      <g fill="url(#hGold)">
        <rect x="124" y="360" width="36" height="44" rx="4"/>
        <rect x="170" y="334" width="36" height="70" rx="4"/>
        <rect x="216" y="308" width="36" height="96" rx="4"/>
        <rect x="262" y="280" width="36" height="124" rx="4"/>
        <rect x="308" y="248" width="36" height="156" rx="4"/>
        <rect x="354" y="214" width="36" height="190" rx="4"/>
      </g>
      <!-- bar highlights -->
      <g fill="#FFFFFF" fill-opacity="0.25">
        <rect x="124" y="360" width="8" height="44" rx="3"/>
        <rect x="170" y="334" width="8" height="70" rx="3"/>
        <rect x="216" y="308" width="8" height="96" rx="3"/>
        <rect x="262" y="280" width="8" height="124" rx="3"/>
        <rect x="308" y="248" width="8" height="156" rx="3"/>
        <rect x="354" y="214" width="8" height="190" rx="3"/>
      </g>

      <!-- Growth pulse trend curve -->
      <path d="M110 372 C170 350 200 322 246 296 S330 236 398 178" fill="none" stroke="#0B1E33" stroke-width="12" stroke-linecap="round" stroke-opacity="0.6"/>
      <path d="M110 372 C170 350 200 322 246 296 S330 236 398 178" fill="none" stroke="url(#hTech)" stroke-width="6" stroke-linecap="round" filter="url(#hSoft)"/>
      <!-- arrow head -->
      <path d="M384 174 L406 170 L400 192" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- pulse dots on curve -->
      <circle cx="246" cy="296" r="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3.5"/>
      <circle cx="326" cy="244" r="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3.5"/>
      <circle cx="398" cy="178" r="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="3.5"/>
    </g>

    <!-- Top crest ornament -->
    <path d="M236 28 L256 44 L276 28" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="24" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Right Side: Official Typographic Lockup -->
  <g transform="translate(182, 18)">
    <!-- Top Supertitle + Badge -->
    <g transform="translate(0, 4)">
      <rect x="0" y="0" width="38" height="20" rx="4" fill="url(#hGoldGrad)" />
      <text x="19" y="15" fill="#0F172A" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11.5" text-anchor="middle" letter-spacing="0.5">PPI</text>
      
      <text x="48" y="15" fill="#38BDF8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2">POLICY INTELLIGENCE &amp; ANALYTICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="54" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="22.5" letter-spacing="0.4">
      MONITORING KEBIJAKAN PUBLIK
    </text>

    <!-- Subtitle / Technological Spine -->
    <text x="0" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="12.5" letter-spacing="0.2">
      Sistem Analisis Jaringan Sosial (SNA) Multiplatform &amp; IndoBERT Deep Learning
    </text>

    <!-- Institutional Focus Pills -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="58" height="18" rx="9" fill="#1E293B" />
      <text x="29" y="13" fill="#E2E8F0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle">MBG</text>

      <rect x="66" y="0" width="102" height="18" rx="9" fill="#1E293B" />
      <text x="117" y="13" fill="#E2E8F0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle">Sekolah Rakyat</text>

      <rect x="176" y="0" width="62" height="18" rx="9" fill="#1E293B" />
      <text x="207" y="13" fill="#E2E8F0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle">KDMP</text>

      <text x="252" y="13" fill="#64748B" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="10.5">• 7 Kanal Media Digital Terintegrasi</text>
    </g>
  </g>
</svg>
