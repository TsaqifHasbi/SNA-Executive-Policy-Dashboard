<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Public Policy Intelligence Platform</title>
  <desc id="d">Logo perisai navy dengan bar chart emas menanjak, kurva tren, dan jejaring node SNA</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14385C"/>
      <stop offset="0.55" stop-color="#0F2942"/>
      <stop offset="1" stop-color="#0B1E33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="1" stop-color="#F6B100"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6B100"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tech" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256 28 L452 88 V250 C452 350 376 430 256 486 C136 430 60 350 60 250 V88 Z"/>
    </clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield outer gold frame -->
  <path d="M256 14 L466 78 V252 C466 360 384 446 256 500 C128 446 46 360 46 252 V78 Z" fill="url(#goldH)" filter="url(#shadow)"/>
  <!-- Shield navy body -->
  <path d="M256 28 L452 88 V250 C452 350 376 430 256 486 C136 430 60 350 60 250 V88 Z" fill="url(#navy)"/>
  <path d="M256 28 L452 88 V250 C452 350 376 430 256 486 C136 430 60 350 60 250 V88 Z" fill="url(#glow)"/>

  <g clip-path="url(#shieldClip)">
    <!-- subtle grid -->
    <g stroke="#94A3B8" stroke-opacity="0.09" stroke-width="1">
      <path d="M60 150H452M60 200H452M60 250H452M60 300H452M60 350H452M60 400H452"/>
      <path d="M110 28V486M160 28V486M210 28V486M260 28V486M310 28V486M360 28V486M410 28V486"/>
    </g>

    <!-- Inner thin gold line -->
    <path d="M256 44 L438 99 V249 C438 340 369 415 256 467 C143 415 74 340 74 249 V99 Z" fill="none" stroke="#F6B100" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- SNA network (upper area) -->
    <g stroke="url(#tech)" stroke-width="2" stroke-opacity="0.85" fill="none">
      <path d="M150 128 L206 100 L268 122 L326 96 L378 130"/>
      <path d="M206 100 L190 160 L150 128"/>
      <path d="M268 122 L250 172 L190 160"/>
      <path d="M268 122 L318 168 L378 130"/>
      <path d="M326 96 L318 168"/>
      <path d="M250 172 L318 168"/>
      <path d="M190 160 L206 100"/>
    </g>
    <g stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1" fill="none">
      <path d="M150 128 L190 160"/>
      <path d="M378 130 L400 176"/>
      <path d="M318 168 L400 176"/>
      <path d="M150 128 L122 172"/>
      <path d="M190 160 L122 172"/>
    </g>
    <g filter="url(#soft)">
      <circle cx="206" cy="100" r="8" fill="#38BDF8"/>
      <circle cx="268" cy="122" r="11" fill="url(#goldH)"/>
      <circle cx="326" cy="96" r="7" fill="#38BDF8"/>
      <circle cx="378" cy="130" r="8" fill="#2563EB"/>
      <circle cx="150" cy="128" r="7" fill="#2563EB"/>
      <circle cx="190" cy="160" r="9" fill="#FFFFFF"/>
      <circle cx="250" cy="172" r="6" fill="#38BDF8"/>
      <circle cx="318" cy="168" r="9" fill="#FFFFFF"/>
    </g>
    <circle cx="122" cy="172" r="5" fill="#94A3B8"/>
    <circle cx="400" cy="176" r="5" fill="#94A3B8"/>
    <circle cx="268" cy="122" r="18" fill="none" stroke="#F6B100" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Baseline -->
    <rect x="112" y="404" width="288" height="3" rx="1.5" fill="#94A3B8" fill-opacity="0.6"/>

    <!-- Ascending bar chart -->
    <g fill="url(#gold)">
      <rect x="124" y="360" width="36" height="44" rx="4"/>
      <rect x="170" y="334" width="36" height="70" rx="4"/>
      <rect x="216" y="308" width="36" height="96" rx="4"/>
      <rect x="262" y="280" width="36" height="124" rx="4"/>
      <rect x="308" y="248" width="36" height="156" rx="4"/>
      <rect x="354" y="214" width="36" height="190" rx="4"/>
    </g>
    <!-- bar highlights -->
    <g fill="#FFFFFF" fill-opacity="0.22">
      <rect x="124" y="360" width="8" height="44" rx="3"/>
      <rect x="170" y="334" width="8" height="70" rx="3"/>
      <rect x="216" y="308" width="8" height="96" rx="3"/>
      <rect x="262" y="280" width="8" height="124" rx="3"/>
      <rect x="308" y="248" width="8" height="156" rx="3"/>
      <rect x="354" y="214" width="8" height="190" rx="3"/>
    </g>

    <!-- Growth pulse trend curve -->
    <path d="M110 372 C170 350 200 322 246 296 S330 236 398 178" fill="none" stroke="#0B1E33" stroke-width="10" stroke-linecap="round" stroke-opacity="0.55"/>
    <path d="M110 372 C170 350 200 322 246 296 S330 236 398 178" fill="none" stroke="url(#tech)" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
    <!-- arrow head -->
    <path d="M384 174 L406 170 L400 192" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- pulse dots on curve -->
    <circle cx="246" cy="296" r="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <circle cx="326" cy="244" r="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <circle cx="398" cy="178" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="398" cy="178" r="15" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- Top crest ornament -->
  <path d="M236 28 L256 44 L276 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <circle cx="256" cy="24" r="4" fill="#FFFFFF"/>
</svg>
