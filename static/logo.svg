<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E33" />
      <stop offset="50%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#071524" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F6B100" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Tech Blue Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bar Chart Gradient 1 -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Bar Chart Gradient 2 -->
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Bar Chart Gradient 3 (Leader Bar) -->
    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Trend Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container / Emblem -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" filter="url(#cardShadow)" />
  
  <!-- Outer Gold Border Rim -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.85" />
  
  <!-- Inner Subtle Concentric Tech Grid Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- ==================== GRAPH / ANALYTICS ELEMENTS ==================== -->
  
  <!-- Coordinate Axis Baseline -->
  <line x1="120" y1="360" x2="392" y2="360" stroke="#475569" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Bar Chart 1 (Initial Data / Ingestion) -->
  <rect x="144" y="280" width="34" height="80" rx="6" fill="url(#bar1Grad)" />
  
  <!-- Bar Chart 2 (Analysis / IndoBERT NLP) -->
  <rect x="198" y="220" width="34" height="140" rx="6" fill="url(#bar2Grad)" />
  
  <!-- Bar Chart 3 (Intelligence / Synthesis - Peak) -->
  <rect x="252" y="160" width="34" height="200" rx="6" fill="url(#bar3Grad)" />

  <!-- Bar Chart 4 (Policy Impact / Output) -->
  <rect x="306" y="240" width="34" height="120" rx="6" fill="url(#bar2Grad)" />

  <!-- ==================== SOCIAL NETWORK ANALYSIS (SNA) LATTICE ==================== -->
  
  <!-- Edge Connections (Network Topology) -->
  <g stroke="#38BDF8" stroke-width="2.5" opacity="0.65">
    <line x1="161" y1="260" x2="215" y2="195" />
    <line x1="215" y1="195" x2="269" y2="135" />
    <line x1="269" y1="135" x2="323" y2="215" />
    <line x1="323" y1="215" x2="375" y2="175" />
    
    <!-- Cross Cluster Ties (Multiplatform Bridges) -->
    <line x1="215" y1="195" x2="323" y2="215" stroke-dasharray="4,4" stroke="#F59E0B" opacity="0.5" />
    <line x1="161" y1="260" x2="269" y2="135" stroke-dasharray="3,3" stroke="#60A5FA" opacity="0.4" />
    <line x1="269" y1="135" x2="380" y2="290" opacity="0.3" stroke="#94A3B8" />
  </g>

  <!-- Trend Curve Line with Glow -->
  <path d="M 125 285 Q 215 190 269 135 T 385 165" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Network Nodes (SNA Hubs & Communities) -->
  <!-- Node 1: Left / Community Alpha -->
  <circle cx="161" cy="260" r="9" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2.5" />
  <circle cx="161" cy="260" r="3" fill="#FFFFFF" />

  <!-- Node 2: Mid-Left / IndoBERT Gateway -->
  <circle cx="215" cy="195" r="11" fill="#0284C7" stroke="#BAE6FD" stroke-width="3" />
  <circle cx="215" cy="195" r="4" fill="#FFFFFF" />

  <!-- Node 3: TOP APEX (Central Authority / Sovereign Hub) -->
  <circle cx="269" cy="135" r="16" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3.5" filter="url(#glow)" />
  <polygon points="269,126 272,133 279,134 274,139 275,146 269,142 263,146 264,139 259,134 266,133" fill="#0F172A" />

  <!-- Node 4: Mid-Right / Multiplatform Sentiment -->
  <circle cx="323" cy="215" r="10" fill="#2563EB" stroke="#93C5FD" stroke-width="2.5" />
  <circle cx="323" cy="215" r="3.5" fill="#FFFFFF" />

  <!-- Node 5: Far Right / Public Outreach Hub -->
  <circle cx="375" cy="175" r="12" fill="#D97706" stroke="#FDE68A" stroke-width="3" />
  <circle cx="375" cy="175" r="4" fill="#FFFFFF" />

  <!-- Satellite Micro Nodes (Public Echoes) -->
  <circle cx="130" cy="210" r="5" fill="#38BDF8" opacity="0.7" />
  <circle cx="365" cy="120" r="6" fill="#FBBF24" opacity="0.8" />
  <circle cx="380" cy="290" r="6" fill="#64748B" opacity="0.6" />
  <line x1="323" y1="215" x2="380" y2="290" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="269" y1="135" x2="365" y2="120" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6" />

  <!-- ==================== INSTITUTIONAL BASE BADGE ==================== -->
  
  <!-- Pill Banner (MONITORING KEBIJAKAN PUBLIK) -->
  <g transform="translate(0, 395)">
    <rect x="76" y="0" width="360" height="42" rx="10" fill="#071524" stroke="#1E293B" stroke-width="2" />
    <rect x="80" y="4" width="40" height="34" rx="7" fill="url(#goldGrad)" />
    <text x="100" y="26" fill="#0F172A" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1">PPI</text>
    
    <text x="276" y="26" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1.5">POLICY INTELLIGENCE</text>
  </g>
</svg>

